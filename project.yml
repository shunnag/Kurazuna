name: Kurazuna
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '27.0'
  developmentLanguage: en
  knownRegions: [en, ja]
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    # The product supports Apple silicon only, in Debug and Release.
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FQTM2788K5
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/src/ISCSIPlatformNative
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 202
    ISCSI_BUNDLE_IDENTIFIER_BASE: dev.soba.iscsi.kurazuna
    ISCSI_APP_NAME: Kurazuna
    ISCSI_FS_SHORT_NAME: kurazuna
    ISCSI_APPLICATION_EDITION: release
    ISCSI_COPYRIGHT: 'Copyright © 2026 Kurazuna contributors'
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
      ISCSI_BUNDLE_IDENTIFIER_BASE: dev.soba.iscsi.kurazuna.development
      ISCSI_APP_NAME: Kurazuna Development
      ISCSI_FS_SHORT_NAME: kurazunadev
      ISCSI_APPLICATION_EDITION: development
targets:
  ISCSICore:
    type: library.static
    platform: macOS
    sources: [src/ISCSICore]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
  ISCSINetwork:
    type: library.static
    platform: macOS
    sources: [src/ISCSINetwork]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: ISCSICore
  ISCSIPlatform:
    type: library.static
    platform: macOS
    sources: [src/ISCSIPlatform]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: ISCSICore
  ISCSIFSBridge:
    type: library.static
    platform: macOS
    sources: [src/ISCSIFSBridge]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: ISCSICore
      - target: ISCSINetwork
      - target: ISCSIPlatform
  Kurazuna:
    type: application
    platform: macOS
    sources:
      - path: src/ISCSIApp
      - path: LICENSE
        type: file
        buildPhase: resources
      - path: LICENSE-MIT
        type: file
        buildPhase: resources
      - path: LICENSE-APACHE
        type: file
        buildPhase: resources
      - path: assets/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCSI_BUNDLE_IDENTIFIER_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: $(ISCSI_APP_NAME)
        INFOPLIST_FILE: config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: config/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ISCSICore
      - target: ISCSINetwork
      - target: ISCSIPlatform
      - target: ISCSIFSExtension
        embed: true
  ISCSIPreview:
    type: application
    platform: macOS
    sources:
      - path: src/ISCSIApp
        excludes: [ISCSIApp.swift]
      - path: LICENSE
        type: file
        buildPhase: resources
      - path: LICENSE-MIT
        type: file
        buildPhase: resources
      - path: LICENSE-APACHE
        type: file
        buildPhase: resources
      - path: tests/ISCSIAppPreview
      - path: assets/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.soba.iscsi.kurazuna.Preview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Kurazuna Preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kurazuna Preview
        INFOPLIST_KEY_NSHumanReadableCopyright: $(ISCSI_COPYRIGHT)
    dependencies:
      - target: ISCSICore
      - target: ISCSINetwork
      - target: ISCSIPlatform
  ISCSIFSExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: src/ISCSIFSExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISCSI_BUNDLE_IDENTIFIER_BASE).FileSystem
        INFOPLIST_FILE: config/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: config/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: ISCSIFSBridge
      - target: ISCSICore
      - target: ISCSINetwork
      - target: ISCSIPlatform
  ISCSIPreviewUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [tests/ISCSIPreviewUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.soba.iscsi.kurazuna.Preview.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ISCSIPreview
        SWIFT_EMIT_LOC_STRINGS: NO
        # The local ad-hoc XCTest runner must load its test bundle without a team identity.
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: ISCSIPreview
schemes:
  ISCSIPreviewUI:
    build:
      targets:
        ISCSIPreview: all
        ISCSIPreviewUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ISCSIPreviewUITests
  ISCSIPreview:
    build:
      targets:
        ISCSIPreview: all
    run:
      config: Debug
  Kurazuna:
    build:
      targets:
        Kurazuna: all
    run:
      config: Debug
    archive:
      config: Release
